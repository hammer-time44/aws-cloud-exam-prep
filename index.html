<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AWS Cloud Computing: Module-wise PYQ Priority Planner</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <main class="main">
      <div class="top">
        <span class="model">AWS Cloud</span>
        <span class="sp"></span>
        <button class="icon-btn" id="theme" aria-label="Switch to light mode" title="Toggle theme"></button>
      </div>

      <div class="scroll" id="scroll">
        <div class="col">
          <section class="cloud" aria-label="cloud">
            <div class="cloud-head">
              <div class="hd-l"><button class="back-btn" id="back" type="button" hidden>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                cloud</button></div>
              <div class="cloud-title" id="title">cloud</div>
              <div class="hd-r"><button class="fat-btn" id="fatBtn" type="button" aria-label="Open FAT question papers">fat</button></div>
            </div>
            <div class="tabs-row" id="tabsRow">
              <div class="tabs" id="tabs" role="tablist"></div>
              <button class="imp-btn" id="impBtn" type="button" aria-label="Open important notice">imp</button>
            </div>
            <div class="body" id="body" role="tabpanel"><p class="none">Loading&hellip;</p></div>
          </section>
        </div>
      </div>

      <div class="composer-wrap">
        <label class="composer" for="q">
          <input id="q" type="search" autocomplete="off">
          <button class="send" type="button" id="clear" aria-label="Clear search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </label>
      </div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
